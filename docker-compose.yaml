version: '3'
services:
  app:
    environment:
      - "SPRING_PROFILES_ACTIVE=docker"
    container_name: eat
    image: eat-app
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - keycloak

  postgres:
    container_name: postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./sql/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.0.7
    command:
      "start-dev --bootstrap-admin-username tmpadm --bootstrap-admin-password pass --import-realm --verbose"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/realms/export:/opt/keycloak/data/import
    ports:
      - "8181:8080"
