spring:
  jpa:
    database: postgresql
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8181/realms/eat-app
#          jwk-set-uri: http://localhost:8181/realms/eat-app/protocol/openid-connect/certs
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:8181/realms/eat-app
            user-name-attribute: preferred_username
        registration:
          keycloak:
            client-id: eat-client
            client-secret: Sn6QB5F09wSVgb5cksVdgJCW9YB4qNmu
            scope:
              - openid

  application:
    name: eat

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=eat
    username: eat
    password: eat

    hikari:
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS eat;

  liquibase:
    changeLog: classpath:db/changelog/changelog.xml
    default-schema: eat

server:
  error:
    include-stacktrace: never

scheduler:
  event: 0 */1 * * * *
springdoc:
  packages-to-scan: ru.sodajavadev.eat