spring:
  jpa:
    database: postgresql
    hibernate:
     ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=eat
    username: eat
    password: eat

  liquibase:
    changeLog: classpath:db/changelog/changelog.xml
    default-schema: eat

server:
  error:
    include-stacktrace: never

